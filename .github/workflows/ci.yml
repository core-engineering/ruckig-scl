name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # ruckig-scl depends on siemens-plc-tools via a relative path
      # ([tool.uv.sources] -> ../siemens-plc-tools/packages/plc-code), so both
      # repos are checked out side by side under the workspace.
      - name: Checkout ruckig-scl
        uses: actions/checkout@v4
        with:
          path: ruckig-scl

      - name: Checkout siemens-plc-tools (transpiler / test harness)
        uses: actions/checkout@v4
        with:
          # Adjust owner/visibility to match where siemens-plc-tools is hosted.
          repository: core-engineering/siemens-plc-tools
          path: siemens-plc-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync core dependencies (offline-installable subset)
        working-directory: ruckig-scl
        run: uv sync

      - name: Run unit tests
        working-directory: ruckig-scl
        run: uv run pytest tests/unit -v

      - name: Sync parity dependencies (Ruckig reference)
        working-directory: ruckig-scl
        run: uv sync --extra parity

      - name: Run parity tests
        working-directory: ruckig-scl
        run: uv run pytest tests/parity -v
