name: v0.4 2-DoF fast axis heavily stretched
# A tiny move (0.5 m) synchronized with a long move (8 m). The fast axis is
# stretched well beyond its own t_min to t_sync, so step2 re-times it to a slow
# S-curve. Confirms the stretched axis still matches Ruckig exactly (it does not
# finish early and park on its target).
n_dofs: 2
target_position: [0.5, 8.0]
max_velocity: [2.0, 2.0]
max_acceleration: [5.0, 5.0]
max_jerk: [10.0, 10.0]
cycle_time: 0.010
