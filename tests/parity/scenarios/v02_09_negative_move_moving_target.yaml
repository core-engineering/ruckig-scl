name: v0.2 negative move with moving target
# Negative-direction move (mirror solve) to a far target with a negative target
# velocity, so the profile reaches cruise (-v_max). Exercises the sign-mirrored
# v0.2 path with a moving target.
n_dofs: 1
current_position: [1.0]
target_position: [-5.0]
target_velocity: [-0.5]
max_velocity: [2.0]
max_acceleration: [5.0]
max_jerk: [10.0]
cycle_time: 0.010
# Parity at the floating-point floor (~1e-15) on every cycle, including the
# finishing one: past `duration` both Ruckig and the SCL FB extrapolate along
# the moving final state (jerk=0), so no terminal-sample override is needed.
