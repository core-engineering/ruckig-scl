name: v0.2 full arbitrary states
# Nonzero initial velocity AND acceleration, nonzero target velocity AND
# acceleration, all within limits, far target so the profile reaches cruise.
# Exercises the fully general v0.2 boundary-condition path.
n_dofs: 1
current_velocity: [0.8]
current_acceleration: [1.0]
target_position: [5.0]
target_velocity: [0.5]
target_acceleration: [0.5]
max_velocity: [2.0]
max_acceleration: [5.0]
max_jerk: [10.0]
cycle_time: 0.010
# Parity at the floating-point floor (~1e-15) on every cycle, including the
# finishing one: past `duration` both Ruckig and the SCL FB extrapolate along
# the moving final state (jerk=0), so no terminal-sample override is needed.
