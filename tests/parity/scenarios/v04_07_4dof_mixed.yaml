name: v0.4 4-DoF (DOF_MAX) mixed
# Full DOF_MAX = 4 axes, heterogeneous displacements and limits including a tiny
# move (0.3 m) heavily stretched to the common t_sync. Exercises the maximum
# supported DoF count of the FB.
n_dofs: 4
target_position: [1.0, 5.0, 2.0, 0.3]
max_velocity: [2.0, 3.0, 2.0, 1.0]
max_acceleration: [5.0, 5.0, 4.0, 3.0]
max_jerk: [10.0, 10.0, 10.0, 8.0]
cycle_time: 0.010
