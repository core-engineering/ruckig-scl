[project]
name = "ruckig-scl-tests"
version = "0.1.0"
description = "Test bench for ruckig-scl SCL implementation"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "plc-code",
]

# NOTE: the cross-implementation parity bench (Tasks 16-19) will add
# `pyruckig>=0.10` as a dependency once it is implemented (requires network to
# install from PyPI). Kept out of the dependency set for now so the unit-test
# suite installs offline.

[tool.uv.sources]
plc-code = { path = "../siemens-plc-tools/packages/plc-code", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
strict = true
